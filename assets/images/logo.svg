<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
    <title>IPP Renovare — Logo</title>
    <desc>Cercle bicolore rouge et noir avec deux maisons stylisées</desc>

    <!-- Arc rouge gauche : descend du haut, fait le côté gauche, remonte par le bas -->
    <path d="M 250 30
             C 130 30, 30 130, 30 250
             C 30 370, 130 470, 250 470
             C 220 460, 195 445, 175 425
             C 130 380, 105 320, 105 255
             C 105 195, 130 140, 170 100
             C 195 75, 225 55, 255 45
             C 270 40, 310 30, 350 35
             C 320 25, 285 22, 250 30 Z"
          fill="#a50e17"/>

    <!-- Arc noir droite : monte par le bas, fait le côté droit, redescend du haut -->
    <path d="M 250 470
             C 370 470, 470 370, 470 250
             C 470 130, 370 30, 250 30
             C 280 40, 305 55, 325 75
             C 370 120, 395 180, 395 245
             C 395 305, 370 360, 330 400
             C 305 425, 275 445, 245 455
             C 230 460, 190 470, 150 465
             C 180 475, 215 478, 250 470 Z"
          fill="#2d2d2d"/>

    <!-- Maison de droite (en arrière, gris foncé) -->
    <!-- Toit triangulaire gris foncé -->
    <polygon points="265,165 350,165 410,235 320,235" fill="#2d2d2d"/>
    <polygon points="265,165 320,235 220,235 250,205" fill="#999999" opacity="0.6"/>
    <!-- Cheminée -->
    <rect x="380" y="170" width="18" height="50" fill="#2d2d2d"/>
    <!-- Mur de la maison droite -->
    <rect x="295" y="225" width="100" height="55" fill="#444"/>
    <!-- Fenêtre maison droite -->
    <rect x="320" y="240" width="30" height="30" fill="#666"/>
    <line x1="335" y1="240" x2="335" y2="270" stroke="#999" stroke-width="2"/>
    <line x1="320" y1="255" x2="350" y2="255" stroke="#999" stroke-width="2"/>

    <!-- Maison de gauche (en avant, rouge) -->
    <!-- Toit triangulaire rouge -->
    <polygon points="180,225 280,225 350,310 250,310 130,310" fill="#a50e17"/>
    <!-- Ombre du toit (effet 3D) -->
    <polygon points="180,225 130,310 100,295" fill="#7a0810" opacity="0.7"/>
    <!-- Mur maison gauche -->
    <rect x="155" y="295" width="170" height="55" fill="#a50e17"/>
    <!-- Fenêtre maison gauche -->
    <rect x="195" y="305" width="35" height="35" fill="#444"/>
    <line x1="212" y1="305" x2="212" y2="340" stroke="#999" stroke-width="2"/>
    <line x1="195" y1="322" x2="230" y2="322" stroke="#999" stroke-width="2"/>
</svg>
