# Configuration Netlify pour le site IPP Renovare

[build]
    publish = "."
    # Pas de build complexe : le site est déjà en HTML statique
    # Si on ajoute un build pour générer les nouveaux articles depuis Markdown :
    # command = "python build.py"

# Activer Netlify Identity pour l'authentification de l'admin
[context.production.environment]
  NETLIFY_USE_YARN = "false"

# ============================================================
# REDIRECTIONS DEPUIS L'ANCIEN WORDPRESS (préservation SEO)
# ============================================================

# /devis.html n'existe plus, redirige vers la page contact (qui contient le formulaire de devis)
[[redirects]]
    from = "/devis.html"
    to = "/contact.html"
    status = 301
    force = true

# Anciennes URLs WordPress éventuelles (avec slash final)
[[redirects]]
    from = "/services/"
    to = "/services.html"
    status = 301

[[redirects]]
    from = "/a-propos/"
    to = "/a-propos.html"
    status = 301

[[redirects]]
    from = "/contact/"
    to = "/contact.html"
    status = 301

[[redirects]]
    from = "/blog/"
    to = "/blog.html"
    status = 301

[[redirects]]
    from = "/devis/"
    to = "/contact.html"
    status = 301

# Page 404 personnalisée (DOIT être en dernier — wildcard)
[[redirects]]
    from = "/*"
    to = "/404.html"
    status = 404

# Forcer HTTPS
[[redirects]]
    from = "http://ipprenovare.com/*"
    to = "https://ipprenovare.com/:splat"
    status = 301
    force = true

# Sécurité : en-têtes recommandés
[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "SAMEORIGIN"
        X-Content-Type-Options = "nosniff"
        X-XSS-Protection = "1; mode=block"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache long pour les assets (images, CSS, JS) — accélère les visites suivantes
[[headers]]
    for = "/assets/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"
